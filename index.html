<html lang="en">

<meta charset="utf-8">

<title>SIF — Sector Exposure</title>
<style>
  :root{ --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e6e9ef; --mut:#8b93a4; --pos:#3fb96b; --neg:#e5534b; --accent:#4c8dff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:1040px; margin:0 auto; padding:28px 20px 80px; }
  h1{ font-size:22px; margin:0 0 2px; }
  .sub{ color:var(--mut); font-size:13px; margin-bottom:22px; }
  .hero{ display:flex; gap:26px; flex-wrap:wrap; margin-bottom:26px; }
  .hero .k{ color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .hero .v{ font-size:26px; font-weight:600; }
  h2{ font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:30px 0 12px; }
  .bars{ display:flex; flex-direction:column; gap:8px; }
  .bar-row{ display:grid; grid-template-columns:180px 1fr 120px; align-items:center; gap:12px; cursor:pointer; }
  .bar-row .lab{ font-size:13px; }
  .bar-track{ background:#12151b; border:1px solid var(--line); border-radius:5px; height:22px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,#4c8dff,#7db1ff); }
  .bar-row .num{ text-align:right; font-variant-numeric:tabular-nums; font-size:13px; color:var(--mut); }
  .bar-row .num b{ color:var(--txt); }
  table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th,td{ text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child{ text-align:left; }
  th{ color:var(--mut); font-weight:500; cursor:pointer; user-select:none; }
  tbody tr:hover{ background:#12151b; }
  .sec-tag{ color:var(--mut); font-size:12px; }
  .hidden{ display:none; }
  .foot{ color:var(--mut); font-size:12px; margin-top:26px; }
</style>
</head>

<div class="wrap">
  <h1>SIF — Sector Exposure</h1>
  <div class="sub" id="sub"></div>
  <div class="hero">
    <div><div class="k">Total Value</div><div class="v" id="hTot"></div></div>

    <div><div class="k">Cash</div><div class="v" id="hCash"></div></div>
    <div><div class="k">Positions</div><div class="v" id="hN"></div></div>
  </div>

  <h2>Sector allocation <span class="sec-tag">(% of total; click a sector to filter the table)</span></h2>
  <div class="bars" id="bars"></div>

  <h2 id="tblTitle">Holdings</h2>
  <table id="tbl">
    <thead><tr>
      <th data-k="symbol">Symbol</th><th data-k="name">Name</th><th data-k="sector">Sector</th>
      <th data-k="mv">Market Value</th><th data-k="pct">% of Total</th>
    </tr></thead>
    <tbody></tbody>
  </table>

  <div class="foot" id="foot"></div>
</div>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const usd = (v,d=0)=>"$"+Number(v).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = v=>v.toFixed(1)+"%";
const TOT = D.positions.reduce((s,p)=>s+p.mv,0);
const CASH = D.positions.filter(p=>p.sector==="Cash").reduce((s,p)=>s+p.mv,0);
document.getElementById("sub").textContent = D.source + " · as of " + D.asOf + " · static snapshot (no live sync)";
document.getElementById("hTot").textContent = usd(TOT);
document.getElementById("hInv").textContent = usd(TOT-CASH);
document.getElementById("hCash").textContent = usd(CASH);
document.getElementById("hN").textContent = D.positions.length;

// sector aggregation
const sec = {};
for(const p of D.positions){ (sec[p.sector]=sec[p.sector]||{mv:0,n:0}); sec[p.sector].mv+=p.mv; sec[p.sector].n++; }
const secRows = Object.entries(sec).map(([s,o])=>({s,mv:o.mv,n:o.n,pct:100*o.mv/TOT})).sort((a,b)=>b.mv-a.mv);
const maxPct = secRows[0].pct;
let activeSector = null;

const barsEl = document.getElementById("bars");
barsEl.innerHTML = secRows.map(r=>`
  <div class="bar-row" data-sec="${r.s}">
    <div class="lab">${r.s}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(r.pct/maxPct*100).toFixed(1)}%"></div></div>
    <div class="num"><b>${pct(r.pct)}</b> · ${usd(r.mv)} · ${r.n}</div>
  </div>`).join("");
barsEl.querySelectorAll(".bar-row").forEach(el=>el.addEventListener("click",()=>{
  activeSector = activeSector===el.dataset.sec ? null : el.dataset.sec;
  render();
}));

// table
let sortK="mv", sortDir=-1;
const tb = document.querySelector("#tbl tbody");
document.querySelectorAll("#tbl th").forEach(th=>th.addEventListener("click",()=>{
  const k=th.dataset.k; if(sortK===k) sortDir*=-1; else { sortK=k; sortDir = (k==="symbol"||k==="name"||k==="sector")?1:-1; }
  render();
}));
function render(){
  let rows = D.positions.slice();
  if(activeSector) rows = rows.filter(p=>p.sector===activeSector);
  rows.sort((a,b)=>{ let x=a[sortK],y=b[sortK]; if(sortK==="pct"){x=a.mv;y=b.mv;} return (typeof x==="string")? sortDir*x.localeCompare(y) : sortDir*(x-y); });
  document.getElementById("tblTitle").textContent = activeSector ? ("Holdings — "+activeSector) : "Holdings (all)";
  tb.innerHTML = rows.map(p=>`<tr><td>${p.symbol}</td><td>${p.name}</td><td class="sec-tag">${p.sector}</td><td>${usd(p.mv,2)}</td><td>${pct(100*p.mv/TOT)}</td></tr>`).join("");
}
render();
document.getElementById("foot").textContent = D.note;
</script>
